<!DOCTYPE html>
<html>
<head>
    <meta charset=
                  "utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="js/hls.js"></script>
    <script src="js/artplayer.js"></script>
    <script src="js/tesseract.min.js"></script>
    <script src="js/worker.min.js"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        .modal-content {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            position: absolute;
            left: auto;
            top: auto;
            transform: translate(-50%, -50%);
        }

        .close {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #container {
            width: 100%;
            height: 100%;
            display: flex;
            background: #000;
        }

        #playlist {
            width: 320px;
            background: #1a1a1a;
            color: #fff;
            overflow-y: auto;
            padding: 15px;
            height: 100vh;
        }

        .time-settings {
            padding: 15px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }

        .time-control {
            margin: 10px 0;
        }

        .time-control label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .slider {
            width: 100%;
            height: 5px;
            background: #333;
            outline: none;
            opacity: 0.7;
            transition: opacity .2s;
        }

        .slider:hover {
            opacity: 1;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #23ade5;
            border-radius: 50%;
            cursor: pointer;
        }

        #player-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .artplayer-app {
            width: 100%;
            aspect-ratio: 16/9;
        }

        .episode-item {
            padding: 10px;
            margin: 5px 0;
            background: #333;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
        }

        .episode-item:hover {
            background: #444;
        }

        .episode-item.active {
            background: #23ade5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            position: relative;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
        }

        #screenshotContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 10px;
            display: none;
            z-index: 1000;
        }

        #screenshotContainer canvas {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
        }

        #info {
            position: absolute;
            top: 10px;
            left: auto;
            right: auto;
            border: white solid 1px;
            min-width: 100px;
            z-index: 1000;
            line-height: 20px;
            min-height: 20px;
            background: #2a2a2a;
            color: #fff;
            display: none;
        }

    </style>
</head>
<body>
<div id="container">
    <div id="playlist">
        <h3 style="color:#fff; margin-bottom:15px;">播放列表</h3>
        <div id="episode-list"></div>
    </div>
    <div id="player-container">
        <p id="info"></p>
        <div class="artplayer-app"></div>
    </div>
</div>
<div id="screenshotContainer"></div>
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div class="time-settings">
            <h4>时间设置</h4>
            <div class="time-control">
                <label>片头时长：<span id="introValue">0</span>秒</label>
                <input type="range" id="introRange" min="0" max="240" value="0" class="slider">
            </div>
            <div class="time-control">
                <label>片尾时长：<span id="outroValue"><script></script></span>秒</label>
                <input type="range" id="outroRange" min="0" max="240" value="0" class="slider">
            </div>
        </div>
    </div>
</div>


<script>
    var intro_duration = {intro_duration};
    var outro_duration = {outro_duration};
    var currentIndex = {currentIndex};
    var video_list = {video_list};
    var last_play_info = {last_play_info}
    var videoUrl = '{video_url}'
    var videoName = '{video_name}'

    var videoPath = 'http://localhost:9009/hls/' + encodeURIComponent(videoName) + '/' + encodeURIComponent(video_list[currentIndex].title) + '/' + videoUrl
    let hls


    // 等待所有资源加载完成
    document.addEventListener('DOMContentLoaded', function () {

        // 弹窗控制逻辑
        const modal = document.getElementById('settingsModal');
        const span = document.querySelector('.close');
        const introRange = document.getElementById('introRange');
        const outroRange = document.getElementById('outroRange');
        const introValue = document.getElementById('introValue');
        const outroValue = document.getElementById('outroValue');
        const info = document.getElementById('info');

        introRange.value = intro_duration;
        outroRange.value = outro_duration;
        introValue.innerHTML = intro_duration;
        outroValue.innerHTML = outro_duration;
        introRange.oninput = () => {
            introValue.innerHTML = introRange.value;
        }
        outroRange.oninput = () => {
            outroValue.innerHTML = outroRange.value;
        }
        // 保存片头片尾数据
        const saveSettings = (event) => {
            if (event?.target === modal) {
                modal.style.display = 'none';
                //
                intro_duration = parseInt(introRange.value);
                outro_duration = parseInt(outroRange.value);
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.save_subscription_data(intro_duration, outro_duration);
                }
            }
        };
        span.onclick = () => {
            modal.style.display = 'none'
            saveSettings();
        };
        window.onclick = saveSettings
        let totalFrags
        // 初始化播放器
        const art = new Artplayer({
            container: '.artplayer-app',
            url: videoPath,
            autoplay: true,
            isLive: false,
            muted: false,
            pip: true,
            autoSize: true,
            autoMini: false,
            screenshot: true,
            setting: true,
            loop: true,
            flip: true,
            playbackRate: true,
            aspectRatio: true,
            fullscreen: true,
            fullscreenWeb: true,
            subtitleOffset: true,
            miniProgressBar: true,
            mutex: true,
            backdrop: true,
            playsInline: true,
            autoPlayback: true,
            airplay: true,
            theme: '#23ade5',
            moreVideoAttr: {
                preload: 'auto', // none | metadata | auto
            },
            customType: {
                m3u8: function (video, url, art) {
                    if (Hls.isSupported()) {
                        // 先销毁之前的实例
                        if (hls) {
                            hls.destroy();
                        }

                        hls = new Hls({
                            enableWorker: true,
                            maxBufferLength: 30,
                            maxMaxBufferLength: 60,
                            levelTargetDuration: 3,
                            maxBufferSize: 30 * 1024 * 1024,
                            backBufferLength: 10,
                            lowLatencyMode: false,
                            enableSoftwareAES: true,
                            fragLoadingTimeOut: 10000,
                            fragLoadingMaxRetry: 3,
                            fragLoadingRetryDelay: 1000,
                            manifestLoadingTimeOut: 10000
                        });

                        hls.loadSource(url);
                        hls.attachMedia(video);

                        hls.on(Hls.Events.ERROR, (event, data) => {
                            console.error('HLS Error:', data);
                            if (data.fatal) {
                                switch (data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        console.log('网络错误，尝试恢复...');
                                        hls.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        console.log('媒体错误，尝试恢复...');
                                        hls.recoverMediaError();
                                        break;
                                    default:
                                        console.log('不可恢复的错误，重新初始化...');
                                        art.notice.show = '播放错误，正在尝试恢复...';
                                        setTimeout(() => {
                                            art.switchUrl(url);
                                        }, 1000);
                                        break;
                                }
                            }
                        });

                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            console.log('HLS 流已准备好');
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                    } else {
                        art.notice.show = '不支持播放m3u8格式';
                    }
                }
            },
            controls: [
                {
                    position: 'right',
                    html: '下载',
                    click: async function () {
                        try {
                            art.notice.show = '下载中...';
                            await fetch('http://localhost:9009/download/' + encodeURIComponent(videoName) + '/' + encodeURIComponent(video_list[currentIndex].title) + '/' + video_list[currentIndex].url)
                            art.notice.show = '下载完成';
                        } catch (error) {
                            art.notice.show = `下载失败: ${error.message}`;
                        }
                    },
                },
                {
                    position: 'right',
                    html: '<svg t="1747519179512" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="8173" width="16" height="16"><path d="M0 160v704q0 66.304 46.848 113.152T160 1024h704q66.304 0 113.152-46.848T1024 864v-704q0-66.304-46.848-113.152T864 0h-704Q93.696 0 46.848 46.848T0 160z m92.16 771.84Q64 903.808 64 864v-704q0-39.744 28.16-67.84Q120.192 64 160 64h704q39.744 0 67.84 28.16 28.16 28.096 28.16 67.84v704q0 39.744-28.16 67.84-28.096 28.16-67.84 28.16h-704q-39.744 0-67.84-28.16z" fill="#ffffff" p-id="8174"></path><path d="M416 512q0 56.128-53.376 104.192l42.752 47.616Q480 596.608 480 512q0-84.672-74.624-151.808l-42.752 47.616Q416 455.808 416 512z" fill="#ffffff" p-id="8175"></path><path d="M430.848 539.008l352 224A32 32 0 0 0 800 768h0.384a32 32 0 0 0 31.616-32v-0.384a32 32 0 0 0-14.848-26.624L507.584 512l309.568-196.992A32 32 0 0 0 832 288v-0.832A32 32 0 0 0 800 256h-1.28a32 32 0 0 0-15.872 4.992l-352 224a32 32 0 0 0 0 54.016zM410.496 442.496Q448 404.992 448 352t-37.504-90.496Q372.992 224 320 224t-90.496 37.504Q192 299.008 192 352t37.504 90.496Q267.008 480 320 480t90.496-37.504z m-45.248-135.744Q384 325.504 384 352t-18.752 45.248Q346.496 416 320 416t-45.248-18.752Q256 378.496 256 352t18.752-45.248Q293.504 288 320 288t45.248 18.752zM410.496 762.496Q448 724.992 448 672t-37.504-90.496Q372.992 544 320 544t-90.496 37.504Q192 619.008 192 672t37.504 90.496Q267.008 800 320 800t90.496-37.504z m-45.248-135.744Q384 645.504 384 672t-18.752 45.248Q346.496 736 320 736t-45.248-18.752Q256 698.496 256 672t18.752-45.248Q293.504 608 320 608t45.248 18.752z" fill="#ffffff" p-id="8176"></path></svg>',
                    click: function () {
                        modal.style.display = 'block';
                    },
                },
                {
                    position: 'left',
                    html: '<svg t="1747588953162" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="5937" width="16" height="16"><path d="M56.576 944.896V79.104C56.576 35.328 92.16 0 135.68 0h15.104c43.776 0 79.36 35.328 79.36 79.104v271.872L810.752 14.08C826.88 4.864 845.056 0 863.488 0c57.6 0.256 104.192 47.104 103.936 104.704V919.04c0 18.432-4.864 36.608-14.08 52.736a104.2944 104.2944 0 0 1-142.592 38.144L230.144 673.024v271.872c0 43.776-35.584 79.104-79.36 79.104H135.68c-43.52 0-79.104-35.328-79.104-79.104z" p-id="5938" fill="#ffffff"></path></svg>',
                    click: function () {
                        previousEpisode()
                    },
                },
                {
                    position: 'left',
                    html: '<svg t="1747588908889" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="4862" width="16" height="16"><path d="M967.423772 79.104472v865.791568c0 43.775978-35.327982 79.10396-79.10396 79.10396h-15.103993c-43.775978 0-79.10396-35.327982-79.10396-79.10396V673.024175L213.248149 1009.920007c-16.127992 9.215995-34.303983 14.079993-52.735973 14.079993a104.345548 104.345548 0 0 1-103.935948-104.703948V104.96046c0-18.431991 4.863998-36.607982 14.079993-52.735974A104.294348 104.294348 0 0 1 213.248149 14.080505l580.86371 336.895832V79.104472A78.847961 78.847961 0 0 1 873.215819 0.000512h15.103993c43.519978 0 79.10396 35.327982 79.10396 79.10396z" p-id="4863" fill="#ffffff"></path></svg>',
                    click: function () {
                        nextEpisode()
                    },
                },

            ]
        });

        // 存储播放器实例
        window.artplayer = art;


        // 播放器准备就绪回调
        art.on('ready', () => {
            jumpOver()
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.onPlayerReady();
            }
        })

        // 时间更新监听
        var index = 0;
        art.on('video:timeupdate', () => {
            if (!art.playing) return;
            const currentTime = art.currentTime;
            const duration = art.duration;

            // 跳过片尾
            if (duration - currentTime < outro_duration) {
                console.log('跳过片尾', duration - currentTime)
                nextEpisode();
            }
            // 触发保存播放进度
            index++
            if (window.pywebview && window.pywebview.api && index % 10 === 0) {
                let video = video_list[currentIndex]
                window.pywebview.api.save_play_history(currentTime, video.title, currentIndex);
            }
        });
        art.on('fullscreen', (state) => {
            console.info('fullscreen', state);
            window.pywebview.api.onFullscreen(state);
        })
        art.on('restart', (url) => {
            jumpOver()
        });
        // 修改销毁逻辑
        art.on('destroy', () => {
            console.log('播放器销毁');
            if (hls) {
                hls.destroy();
            }
        });
        art.on('video:waiting', () => {
            art.notice.show = '正在加载...';
        });
        art.on('video:playing', () => {
            art.notice.show = '';
        });
        art.on('error', (err) => {
            console.error('播放器错误:', err);
            art.notice.show = '播放错误，正在尝试恢复...';
            setTimeout(() => {
                art.switchUrl(art.url);
            }, 2000);
        });


        function parseM3U8(text) {
            const segments = [];
            let encryptionKey = null;

            text.split('\n').forEach(line => {
                if (line.startsWith('#EXT-X-KEY')) {
                    const match = line.match(/URI="([^"]+)"/);
                    encryptionKey = match ? match[1] : null;
                }
                if (line.endsWith('.ts')) {
                    segments.push({
                        uri: new URL(line, art.url).href, // 处理相对路径
                        key: encryptionKey
                    });
                }
            });

            return {segments, encryptionKey};
        }
    })

    function jumpOver() {
        console.log('跳过片头', last_play_info.current_time, intro_duration, last_play_info.current_time > intro_duration)
        if (last_play_info.current_time > intro_duration) {
            // 调到历史播放进度
            window.artplayer.seek = last_play_info.current_time;
            setTimeout(() => {
                last_play_info.current_time = 0
            }, 100)
        } else {
            // 跳过片头
            window.artplayer.seek = intro_duration;
        }
    }

    // 播放指定剧集
    function playEpisode(index) {
        console.log('指定剧集', video_list[index],index)
        if (window.artplayer && video_list[index]) {
            currentIndex = index;
            videoPath = 'http://localhost:9009/hls/' + encodeURIComponent(videoName) + '/' + encodeURIComponent(video_list[currentIndex].title) + '/' + video_list[index].url
            // 先暂停并销毁之前的流
            window.artplayer.switchUrl(videoPath);
            // 通知Python端
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.playEpisode(index);
            }
            updatePlaylist();
        }
    }

    function nextEpisode() {
        if (currentIndex < video_list.length) {
            let index = currentIndex + 1;
            playEpisode(index);
        }
    }

    function previousEpisode() {
        if (currentIndex < video_list.length) {
            let index = currentIndex - 1;
            playEpisode(index);
        }
    }


    function updatePlaylist() {
        const listElement = document.getElementById('episode-list');
        listElement.innerHTML = ''

        video_list.forEach((episode, index) => {
            const item = document.createElement('div');
            item.className = 'episode-item';
            item.textContent = episode.title;
            item.onclick = function () {
                // 更新当前选中项样式
                document.querySelectorAll('.episode-item').forEach(el => {
                    el.classList.remove('active');
                });
                this.classList.add('active');

                // 播放选中剧集
                playEpisode(index);
            };
            listElement.appendChild(item);
        });


        const items = document.querySelectorAll('.episode-item');
        if (items.length > currentIndex) {
            items[currentIndex].classList.add('active');
            items[currentIndex].scrollIntoView({
                behavior: 'smooth',
                block: 'nearest'
            });
        }

    }

    updatePlaylist();


</script>

</body>
</html>
